<main>
 <header>
  <div class="masthead"><div class="brand"></div><button id="theme" class="theme-button" aria-label="Switch page theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg><span>Dark</span></button></div>
  <div class="page-heading"><h1>PTP completion</h1><div class="stats"><div class="stat"><strong id="stat-ptps"></strong><span id="stat-ptps-label">Live PTPs</span></div><div class="stat"><strong id="stat-completion"></strong><span>Perfect pages</span></div><div class="stat"><strong id="stat-pls">14</strong><span>Product lines</span></div></div></div>

<script>
'use strict';
const DATA = __CHARTS_DATA__;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const BLS=['DSI','ICW','MMS','RF'], sum=(a,f)=>a.reduce((s,x)=>s+f(x),0), fmt=n=>n.toLocaleString('en-US'), pct=n=>(n*100).toFixed(1)+'%';
const totalPTPs=sum(DATA.pls,p=>p.ptps);
const selectedPL=new Set(DATA.pls.map(p=>p.pl)),selectedComponents=new Set(DATA.keyComponents), charts=new Map();
try{const saved=JSON.parse(localStorage.getItem('ptp-components-v2'));if(Array.isArray(saved)&&saved.every(c=>DATA.components.includes(c))){selectedComponents.clear();saved.forEach(c=>selectedComponents.add(c));}}catch{}
try{const saved=JSON.parse(localStorage.getItem('ptp-selected-pls'));if(Array.isArray(saved)&&saved.every(id=>DATA.pls.some(p=>p.pl===id))){selectedPL.clear();saved.forEach(id=>selectedPL.add(id));}}catch{}
// Online / Offline / Both and the product status narrow the PTPs themselves:
// every chart reads p.ptps, p.have and p.bits, so those are recomputed from
// the full per-PTP lists (bits, on = online, st = status index, -1 = none).
const RAW=DATA.pls.map(p=>({bits:p.bits.slice(),on:p.on||p.bits.map(()=>1),st:p.st||p.bits.map(()=>-1),bt:p.bt||p.bits.map(()=>0)}));
// Which buy-box labels count as a buy button: a page has the Buy button
// component when it shows any ticked label.
const BUY_TYPES=DATA.buyTypes||[],BUY_BIT=DATA.components.indexOf('Buy button');
const selectedBuy=new Set(DATA.buyDefault||[]);
try{const v=JSON.parse(localStorage.getItem('ptp-buy'));if(Array.isArray(v)){selectedBuy.clear();v.forEach(x=>selectedBuy.add(x));}}catch{}
const buyMask=()=>[...selectedBuy].reduce((m,i)=>m|(1<<i),0);
const withBuy=(b,t)=>BUY_BIT<0?b:(b&~(1<<BUY_BIT))|((t&buyMask())?1<<BUY_BIT:0);
const STATUSES=DATA.statuses||[];
let pageState='online';try{const v=localStorage.getItem('ptp-pages');if(['online','offline','both'].includes(v))pageState=v;}catch{}
// Active and preferred is the default focus (Dominik, Nov 2026)
const selectedStatus=new Set(STATUSES.includes('Active and preferred')?[STATUSES.indexOf('Active and preferred')]:[...STATUSES.map((_,i)=>i),-1]);
try{const v=JSON.parse(localStorage.getItem('ptp-status-v2'));if(Array.isArray(v)){selectedStatus.clear();v.forEach(x=>selectedStatus.add(x));}}catch{}
const pageOk=on=>pageState==='both'||(pageState==='online')===!!on;
function applyPageFilter(){DATA.pls.forEach((p,k)=>{const r=RAW[k],bits=[];r.bits.forEach((b,i)=>{if(pageOk(r.on[i])&&selectedStatus.has(r.st[i]))bits.push(withBuy(b,r.bt[i]));});p.bits=bits;p.ptps=bits.length;p.have={};DATA.components.forEach((c,ci)=>{p.have[c]=bits.reduce((n,b)=>n+(b>>ci&1),0);});});}
applyPageFilter();
const activePLs=()=>DATA.pls.filter(p=>selectedPL.has(p.pl)&&p.ptps>0);
const activeBLs=()=>BLS.filter(bl=>activePLs().some(p=>p.bl===bl));

function exportSVG(id){
 const dark=$('#export-theme').value==='dark',p=palette(dark),article=document.getElementById(id),title=article.querySelector('.chart-title').textContent.trim(),spec=charts.get(id);
 let raw=id==='heatmap'?heatmap(dark):barChart({...spec,title},Math.max(600,spec.width||600),dark),doc=new DOMParser().parseFromString(raw,'image/svg+xml'),root=doc.documentElement,w=+root.getAttribute('width'),h=+root.getAttribute('height'),titleLines=wrapLabel(title,Math.floor((w-64)/13)),titleH=titleLines.length*30+30;
 let titleSVG=titleLines.map((s,i)=>text(28,36+i*30,s,{fill:p.ink,size:22,weight:600})).join('');
 if(spec?.pls)titleSVG+=text(w-28,titleH-7,fmt(sum(spec.pls,p=>p.ptps))+' PTPs',{fill:p.muted,size:12,anchor:'end'});
 let legend='';if(id==='heatmap'){let ly=h+titleH+14;legend=text(w-300,ly+10,'0%',{fill:p.muted,size:11});for(let i=0;i<8;i++)legend+=`<rect x="${w-270+i*25}" y="${ly+2}" width="23" height="8" fill="${magnitude(i/7)}"/>`;legend+=text(w-24,ly+10,'100%',{fill:p.muted,size:11,anchor:'end'});}

}
async function downloadChart(id,format){
 let source=exportSVG(id),blob=new Blob([source],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob);
 try{if(format==='png'){let img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});let canvas=document.createElement('canvas');canvas.width=img.width*2;canvas.height=img.height*2;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw new Error('PNG generation failed');}

 }finally{URL.revokeObjectURL(url);}

<style>
  html.embedded main { max-width: none; padding: 14px 4px 28px; }
  html.embedded, html.embedded body { overflow: hidden; }
  html.tabbed nav a:first-child { border-bottom: 2px solid transparent; color: var(--muted); }
  html.tabbed nav a.on { border-bottom: 2px solid var(--accent); color: var(--ink); }
  html.tabbed main > section[id], html.tabbed main > article#heatmap { margin-top: 8px !important; }
</style>
<script>
// The section links are real tabs: one section on screen at a time, so the
// page is as long as what you are looking at, not all six sections stacked.
document.addEventListener('DOMContentLoaded', function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('nav[aria-label="Chart sections"] a'));
  var ids = links.map(function (a) { return a.getAttribute('href').slice(1); });
  var panels = ids.map(function (id) { return document.getElementById(id); });
  if (!links.length || panels.some(function (p) { return !p; })) return;
  document.documentElement.classList.add('tabbed');
  function show(id) {
    if (ids.indexOf(id) < 0) id = ids[0];
    panels.forEach(function (p, i) { p.hidden = ids[i] !== id; });
    links.forEach(function (a, i) { a.classList.toggle('on', ids[i] === id); a.setAttribute('aria-current', ids[i] === id ? 'page' : 'false'); });
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    try { if (typeof renderAll === 'function') renderAll(); } catch (e) {}
    window.scrollTo(0, 0);
  }
  links.forEach(function (a, i) { a.addEventListener('click', function (e) { e.preventDefault(); show(ids[i]); }); });
  show((location.hash || '').slice(1));
});
</script>
<script>
// Inside iRadar: follow iRadar's theme switch (no second toggle), use the full
// width, and tell the page how tall the charts are so it can size the frame.
(function () {
  try {
    if (window.parent === window) return;
    document.documentElement.classList.add('embedded');
    var root = window.parent.document.documentElement;
    var mast = document.querySelector('.masthead'); if (mast) mast.style.display = 'none';
    var sync = function () { pageDark = root.dataset.theme === 'dark'; manualTheme = true; applyTheme(); };
    sync();
    new MutationObserver(sync).observe(root, {attributes: true, attributeFilter: ['data-theme']});
    var last = 0;
    var post = function () {
      var h = Math.ceil(document.body.getBoundingClientRect().height);
      if (h !== last) { last = h; window.parent.postMessage({type: 'charts-height', h: h}, location.origin); }
    };
    post();
    new ResizeObserver(post).observe(document.body);
    window.addEventListener('load', post);
  } catch (e) {}
})();
</script>
