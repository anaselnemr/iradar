<main>
 <header>
  <div class="masthead"><div class="brand"></div><button id="theme" class="theme-button" aria-label="Switch page theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg><span>Dark</span></button></div>
  <div class="page-heading"><h1>PTP completion</h1><div class="stats"><div class="stat"><strong id="stat-ptps"></strong><span>Live PTPs</span></div><div class="stat"><strong id="stat-completion"></strong><span>Components in place</span></div><div class="stat"><strong id="stat-pls">14</strong><span>Product lines</span></div></div></div>
  <nav aria-label="Chart sections"><a href="#key-components">Key components</a><a href="#heatmap">Heatmap</a><a href="#overview">Overview</a><a href="#business-lines">Business lines</a><a href="#product-lines">Product lines</a><a href="#components">Components</a></nav>
 </header>
 <div class="shared-filters">
 <details id="component-picker" open aria-label="Components"><summary class="picker-heading"><span>Components</span><div class="quick-buttons"><button type="button" data-preset="key">Key 7</button><button type="button" data-preset="all">All 17</button></div></summary><div class="component-chips"></div></details>
 <fieldset id="scope-picker" aria-label="Scope"><div class="picker-heading"><span>Scope</span><div class="quick-buttons"><button type="button" data-scope-preset="all">All</button><button type="button" data-scope-preset="none">None</button></div></div><div class="scope-groups"></div></fieldset>
 </div>
 <section id="key-components"><div id="key-grid" class="chart-grid"></div></section>
 <article style="margin-top:34px" id="heatmap" class="card">
  <div class="card-head"><h2 class="chart-title" contenteditable="plaintext-only" spellcheck="false" aria-label="Heatmap chart title">Components by product line</h2><div class="card-actions"><button data-export="png" data-card="heatmap" aria-label="Download heatmap PNG">PNG ↓</button><button data-export="svg" data-card="heatmap" aria-label="Download heatmap SVG">SVG ↓</button></div></div>
  <div class="toolbar">
   <label class="control-label">Cell value<select id="metric"><option value="percent">% with it</option><option value="have">PTPs with it</option><option value="missing">PTPs missing it</option><option value="missingPercent">% missing</option></select></label>
   <label class="control-label">Row order<select id="order"><option value="desc">Most complete first</option><option value="asc">Least complete first</option><option value="page">Page order</option></select></label>
   <button id="choose-pl">Product lines · 14</button><span class="spacer"></span>
   <div class="export-settings"><label class="toggle"><input id="group" type="checkbox" checked>Group by BL</label><label class="control-label">Hue<input id="hue" type="color" value="#087e8b" aria-label="Chart accent hue"></label><label class="control-label">Export<select id="export-theme" aria-label="Export background"><option value="light">Light</option><option value="dark">Dark</option></select></label></div>
  </div>
  <div class="heat-scroll" aria-label="Component completion heatmap" tabindex="0"></div>
  <div class="heat-footer"><span>0%</span><div class="spectrum" aria-hidden="true"></div><span>100%</span></div>
 </article>
 <section id="overview"><div class="section-heading"><h2>Overview</h2><span>4,249 PTPs</span></div><div class="chart-grid" id="overview-grid"></div></section>

</main>
<dialog id="filter-dialog" aria-labelledby="filter-title"><div class="dialog-head"><h2 id="filter-title"></h2><button id="close-filter" aria-label="Close selection">×</button></div><div class="dialog-options"></div><div class="dialog-actions"><div><button id="select-all">All</button><button id="select-none">None</button></div><button id="apply-filter" class="primary">Apply</button></div></dialog>

<script>
'use strict';
const DATA = __CHARTS_DATA__;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const BLS=['DSI','ICW','MMS','RF'], sum=(a,f)=>a.reduce((s,x)=>s+f(x),0), fmt=n=>n.toLocaleString('en-US'), pct=n=>(n*100).toFixed(1)+'%';
const totalPTPs=sum(DATA.pls,p=>p.ptps), totalHave=sum(DATA.pls,p=>sum(DATA.components,c=>p.have[c])), totalExpected=totalPTPs*DATA.components.length;
const selectedPL=new Set(DATA.pls.map(p=>p.pl)),selectedComponents=new Set(DATA.keyComponents), charts=new Map();
try{const saved=JSON.parse(localStorage.getItem('ptp-selected-components'));if(Array.isArray(saved)&&saved.every(c=>DATA.components.includes(c))){selectedComponents.clear();saved.forEach(c=>selectedComponents.add(c));}}catch{}
try{const saved=JSON.parse(localStorage.getItem('ptp-selected-pls'));if(Array.isArray(saved)&&saved.every(id=>DATA.pls.some(p=>p.pl===id))){selectedPL.clear();saved.forEach(id=>selectedPL.add(id));}}catch{}
const activePLs=()=>DATA.pls.filter(p=>selectedPL.has(p.pl));
const activeBLs=()=>BLS.filter(bl=>activePLs().some(p=>p.bl===bl));
const activeComponents=()=>[...DATA.keyComponents,...DATA.components.filter(c=>!DATA.keyComponents.includes(c))].filter(c=>selectedComponents.has(c));
const selectedMask=()=>DATA.components.reduce((mask,c,i)=>selectedComponents.has(c)?mask|(1<<i):mask,0);
function allCount(pls){const mask=selectedMask();return sum(pls,p=>sum(p.bits,b=>(b&mask)===mask?1:0));}
function allEntry(pls,label='All of the above',group){const total=sum(pls,p=>p.ptps),have=allCount(pls);return {label,group,have,total,value:total?have/total:0,unit:'PTPs',all:true};}
let accent='#087e8b' ,pageDark=matchMedia('(prefers-color-scheme: dark)').matches, manualTheme=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function palette(dark){return dark?{bg:'#18242c',ink:'#edf3f6',muted:'#a9b8c1',line:'#35434c',track:'#34434c'}:{bg:'#ffffff',ink:'#202d36',muted:'#5e6e79',line:'#dce3e6',track:'#e7edef'};}
function magnitude(v){let rgb=accent.match(/\w\w/g).map(x=>parseInt(x,16)),low=[242,247,248],t=Math.max(0,Math.min(1,v));return '#'+rgb.map((x,i)=>Math.round(low[i]+(x-low[i])*t).toString(16).padStart(2,'0')).join('');}
// Choose the higher WCAG contrast against the actual cell fill (at least 4.58:1).
function cellInk(v){let rgb=magnitude(v).match(/\w\w/g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4),l=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];return 1.05/(l+.05)>(l+.05)/.05?'#ffffff':'#000000';}
function text(x,y,s,{size=12,fill,anchor='start',weight=400,extra=''}={}){return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill||'#202d36'}" text-anchor="${anchor}" font-weight="${weight}" ${extra}>${esc(s)}</text>`;}
const line=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1"/>`;
function tipAttr(lines){return `data-tip="${esc(JSON.stringify(lines))}"`;}
function svgRoot(w,h,body,p,label){return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-label="${esc(label)}"><rect width="${w}" height="${h}" fill="${p.bg}"/>${body}</svg>`;}
function metricValue(h,n){switch($('#metric').value){case'have':return fmt(h);case'missing':return fmt(n-h);case'missingPercent':return Math.round((n-h)/n*100)+'%';default:return Math.round(h/n*100)+'%';}}
function heatmap(dark=false){
 const p=palette(dark),pls=activePLs(), grouped=$('#group').checked,rows=DATA.components.filter(c=>selectedComponents.has(c));
 const numerator=c=>sum(pls,p=>p.have[c]);if($('#order').value!=='page')rows.sort((a,b)=>($('#order').value==='desc'?-1:1)*(numerator(a)-numerator(b)));
 rows.push('All of the above');
 const w=1240,left=184,right=12,top=grouped?79:49,rowH=34,gap=3,groupGap=grouped?10:3, usable=w-left-right;
 if(!pls.length)return svgRoot(w,150,text(w/2,80,!pls.length?'No product lines selected':'No components selected',{anchor:'middle',fill:p.muted,size:16}),p,'Component completion heatmap');
 const gaps=pls.slice(1).map((pl,i)=>grouped&&pl.bl!==pls[i].bl?groupGap:gap),cw=(usable-sum(gaps,x=>x))/pls.length;
 let x=left,coords=pls.map((pl,i)=>{let v=x;x+=cw+(gaps[i]||0);return v;});let body='';
 if(grouped)BLS.forEach(bl=>{let ix=pls.map((p,i)=>p.bl===bl?i:-1).filter(i=>i>=0);if(!ix.length)return;let start=coords[ix[0]],end=coords[ix.at(-1)]+cw;body+=text((start+end)/2,23,bl,{fill:p.ink,size:12,weight:650,anchor:'middle'});body+=line(start,35,end,35,p.line);});
 pls.forEach((pl,i)=>{body+=text(coords[i]+cw/2,grouped?59:29,pl.label,{fill:p.muted,size:11,anchor:'middle'});});
 rows.forEach((c,j)=>{let y=top+j*rowH+(c==='All of the above'?14:0);if(c==='All of the above')body+=line(12,y-8,w-12,y-8,p.line);body+=text(left-15,y+19,c,{fill:p.ink,size:12,anchor:'end'});pls.forEach((pl,i)=>{let have=c==='All of the above'?allCount([pl]):pl.have[c],ratio=have/pl.ptps,v=['missing','missingPercent'].includes($('#metric').value)?1-ratio:ratio,value=metricValue(have,pl.ptps);body+=`<g ${tipAttr([value,`${fmt(have)} of ${fmt(pl.ptps)} PTPs`,`${fmt(pl.ptps-have)} missing`,`${c} · ${pl.label}`])}><rect x="${coords[i]}" y="${y}" width="${cw}" height="${rowH-3}" rx="3" fill="${magnitude(v)}"/>${text(coords[i]+cw/2,y+19,value,{fill:cellInk(v),size:11,anchor:'middle',extra:'style="font-variant-numeric:tabular-nums"'})}</g>`;});});
 return svgRoot(w,top+rows.length*rowH+21,body,p,'Component completion by product line');
}
function completion(pls,label,group){let n=sum(pls,p=>p.ptps)*selectedComponents.size,h=sum(pls,p=>sum(activeComponents(),c=>p.have[c]));return {label,group,value:n?h/n:0,have:h,total:n,unit:'components'};}
let overviewEntries=[completion(DATA.pls,'All PTPs'),...BLS.map(bl=>completion(DATA.pls.filter(p=>p.bl===bl),bl))];
function componentEntries(pls){let n=sum(pls,p=>p.ptps);return activeComponents().map(c=>({label:c,have:sum(pls,p=>p.have[c]),total:n,value:n?sum(pls,p=>p.have[c])/n:0,unit:'PTPs'}));}
function percentComponents(){return componentEntries(activePLs());}
function chartTip(e,percent){return tipAttr([percent?pct(e.value):fmt(e.have),`${fmt(e.have)} of ${fmt(e.total)} ${e.unit}`,`${fmt(e.total-e.have)} missing`,e.label]);}
function roundedBar(x,y,w,h,vertical){if(!w||!h)return '';let r=Math.min(4,w/2,h/2);return vertical?`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`:`M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`;}
function wrapLabel(s,max=18){let words=s.split(' '),lines=[''];for(let word of words){if(lines.at(-1).length+word.length+1>max&&lines.at(-1))lines.push(word);else lines[lines.length-1]+=(lines.at(-1)?' ':'')+word;}return lines;}
function barChart(spec,w,dark){
 const p=palette(dark),entries=spec.pls&&spec.type!=='split'?[...spec.entries,allEntry(spec.pls)]:spec.entries,percent=spec.percent,type=spec.type;
 if((spec.pls&&!spec.pls.length)||!activePLs().length)return svgRoot(w,100,text(w/2,55,'No product lines selected',{fill:p.muted,anchor:'middle'}),p,spec.title);
 if(type==='split')return keyChart(spec,w,dark);

<script>
// The section links are real tabs: one section on screen at a time, so the
// page is as long as what you are looking at, not all six sections stacked.
document.addEventListener('DOMContentLoaded', function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('nav[aria-label="Chart sections"] a'));
  var ids = links.map(function (a) { return a.getAttribute('href').slice(1); });
  var panels = ids.map(function (id) { return document.getElementById(id); });
  if (!links.length || panels.some(function (p) { return !p; })) return;
  document.documentElement.classList.add('tabbed');
  function show(id) {
    if (ids.indexOf(id) < 0) id = ids[0];
    panels.forEach(function (p, i) { p.hidden = ids[i] !== id; });
    links.forEach(function (a, i) { a.classList.toggle('on', ids[i] === id); a.setAttribute('aria-current', ids[i] === id ? 'page' : 'false'); });
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    try { if (typeof renderAll === 'function') renderAll(); } catch (e) {}
    window.scrollTo(0, 0);
  }
  links.forEach(function (a, i) { a.addEventListener('click', function (e) { e.preventDefault(); show(ids[i]); }); });
  show((location.hash || '').slice(1));
});
</script>

// width, and tell the page how tall the charts are so it can size the frame.
(function () {
  try {
    if (window.parent === window) return;
    document.documentElement.classList.add('embedded');
    var root = window.parent.document.documentElement;
    var mast = document.querySelector('.masthead'); if (mast) mast.style.display = 'none';
    var sync = function () { pageDark = root.dataset.theme === 'dark'; manualTheme = true; applyTheme(); };
    sync();
    new MutationObserver(sync).observe(root, {attributes: true, attributeFilter: ['data-theme']});
    var last = 0;
    var post = function () {
      var h = Math.ceil(document.body.getBoundingClientRect().height);
      if (h !== last) { last = h; window.parent.postMessage({type: 'charts-height', h: h}, location.origin); }
    };
    post();
    new ResizeObserver(post).observe(document.body);
    window.addEventListener('load', post);
  } catch (e) {}
})();
</script>
</body>
</html>
