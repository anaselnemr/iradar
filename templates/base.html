<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}InfineonWatch{% endblock %}</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #1a2332; --muted: #64748b;
    --accent: #b7002d; --ok: #16a34a; --warn: #d97706; --err: #dc2626;
    --line: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
         background: var(--bg); color: var(--ink); font-size: 15px; }
  header { background: #1a2332; color: #fff; padding: 14px 28px;
           display: flex; align-items: center; gap: 24px; }
  header .logo { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  header .logo span { color: #ff5a7a; }
  header nav a { color: #cbd5e1; text-decoration: none; margin-right: 18px;
                 font-size: 14px; }
  header nav a:hover { color: #fff; }
  main { max-width: 1200px; margin: 24px auto; padding: 0 20px 60px; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 14px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600;
       padding: 8px 10px; border-bottom: 2px solid var(--line);
       font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line);
       vertical-align: middle; }
  tr:hover td { background: #f8fafc; }
  a { color: #0f5bd7; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
           font-size: 12px; font-weight: 600; white-space: nowrap; }
  .b-changed  { background: #fef3c7; color: #92400e; }
  .b-unchanged{ background: #dcfce7; color: #166534; }
  .b-baseline { background: #dbeafe; color: #1e40af; }
  .b-error    { background: #fee2e2; color: #991b1b; }
  .notice     { background: #fffbeb; border: 1px solid #fde68a; color: #78350f;
                border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .b-sys      { background: #ede9fe; color: #5b21b6; }
  .b-redir    { background: #fef3c7; color: #92400e; cursor: help; }
  .sorth { cursor: pointer; color: inherit; text-decoration: none;
           user-select: none; white-space: nowrap; }
  .sorth:hover { color: var(--accent); text-decoration: underline; }
  .b-newpg { background: #16a34a; color: #fff; font-weight: 700;
             letter-spacing: .3px; }
  .flagbox    { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
  .flagrow    { display: flex; align-items: center; gap: 8px; font-size: 13px;
                border: 1px solid var(--line); border-radius: 8px;
                padding: 6px 10px; background: #fbfcfe; }

  /* --- one item, every page it is assigned to --- */
  .itemhero { display: flex; gap: 24px; align-items: flex-start; }
  .itemhero-main { flex: 1; min-width: 0; }
  .itemhero-side { border-left: 1px solid var(--line); padding-left: 20px; }
  .itemtags { display: flex; gap: 6px; flex-wrap: wrap; }
  .grouphead { font-size: 12.5px; font-weight: 700; text-transform: uppercase;
               letter-spacing: .6px; color: var(--muted); margin: 16px 0 8px; }
  .pagegrid { display: grid; gap: 10px;
              grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .pagecard { display: block; border: 1px solid var(--line); border-radius: 9px;
              padding: 11px 13px; text-decoration: none; color: inherit;
              background: #fff; transition: border-color .15s, box-shadow .15s; }
  .pagecard:hover { border-color: var(--accent);
                    box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .pagecard-title { font-weight: 600; font-size: 14px; margin-bottom: 3px;
                    overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; }
  .pagecard-url { font-size: 11.5px; color: #0f5bd7; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }

  /* --- hierarchy tree --- */
  .tree { font-size: 14px; }
  .tnode > summary { cursor: pointer; padding: 5px 6px; border-radius: 6px;
                     list-style: none; display: flex; align-items: center;
                     gap: 8px; }
  .tnode > summary::-webkit-details-marker { display: none; }
  .tnode > summary::before { content: "▸"; color: var(--muted);
                             font-size: 11px; transition: transform .15s; }
  .tnode[open] > summary::before { transform: rotate(90deg); }
  .tnode > summary:hover { background: #f1f5f9; }
  .tname { font-weight: 600; }
  .tcount { font-size: 11.5px; color: var(--muted); background: #f1f5f9;
            border-radius: 999px; padding: 1px 8px; }
  .tbody { margin-left: 13px; padding-left: 11px;
           border-left: 1px solid var(--line); }
  .tleaf { padding: 4px 6px; display: flex; gap: 8px; align-items: center; }
  .tleaf:hover { background: #f8fafc; border-radius: 5px; }
  /* Infineon's own page levels: PC > PFP > PSFP > PEFP > PTP */
  .lvl { font-size: 10.5px; font-weight: 700; letter-spacing: .4px;
         border-radius: 4px; padding: 1px 5px; flex-shrink: 0;
         font-family: Consolas, monospace; }
  .lvl-pc   { background: #1e293b; color: #fff; }
  .lvl-pfp  { background: #1d4ed8; color: #fff; }
  .lvl-psfp { background: #3b82f6; color: #fff; }
  .lvl-pefp { background: #93c5fd; color: #0f2b5b; }
  .lvl-ptp  { background: #e0e7ff; color: #3730a3; }
  .lvl-eb   { background: #fde68a; color: #713f12; }
  .lvl-adp  { background: #065f46; color: #fff; }
  .lvl-aop  { background: #059669; color: #fff; }
  .lvl-asp  { background: #6ee7b7; color: #064e3b; }
  .lvl-afb  { background: #d1fae5; color: #065f46; }

  /* --- search type-ahead --- */
  .sugwrap { position: relative; }
  /* the dropdown is wider than the input so long document titles are readable,
     and each row is two lines: title on top, category / language / pages below */
  .suggest { position: absolute; top: calc(100% + 6px); left: 0; right: auto;
             min-width: min(560px, 92vw); max-width: 92vw; max-height: 72vh;
             overflow-y: auto; background: #fff; border: 1px solid var(--line);
             border-radius: 12px; box-shadow: 0 12px 34px rgba(0,0,0,.17);
             z-index: 40; display: none; }
  .suggest.on { display: block; }
  .suggest button { all: unset; display: flex; gap: 13px; align-items: center;
                    width: 100%; padding: 12px 17px; cursor: pointer;
                    box-sizing: border-box; border-bottom: 1px solid var(--line); }
  .suggest button:last-child { border-bottom: 0; }
  .suggest button:hover, .suggest button.sel { background: #eef2ff; }
  .suggest .sicon { flex-shrink: 0; display: flex; }
  .suggest .scol { display: flex; flex-direction: column; gap: 3px;
                   min-width: 0; flex: 1 1 auto; }
  .suggest .stitle { font-size: 15.5px; font-weight: 600; color: var(--ink);
                     line-height: 1.3; overflow: hidden; word-break: break-word;
                     display: -webkit-box; -webkit-line-clamp: 2;
                     -webkit-box-orient: vertical; }
  .suggest .smeta { font-size: 12.5px; color: var(--muted); }
  /* type icons — inherit text colour, so they work in both themes */
  .ticon { width: 17px; height: 17px; flex-shrink: 0; display: inline-block;
           vertical-align: -3px; color: var(--accent); }
  .suggest .ticon { width: 22px; height: 22px; color: var(--muted); }
  .hit-title-row { display: flex; align-items: center; gap: 9px;
                   flex-wrap: wrap; }
  .hit-title-row .ticon { width: 19px; height: 19px; }
  .b-new      { background: #e2e8f0; color: #475569; }
  .b-off      { background: #f1f5f9; color: #94a3b8; }
  button, .btn { background: var(--accent); border: 0; color: #fff;
        padding: 8px 16px; border-radius: 7px; font-size: 14px;
        font-weight: 600; cursor: pointer; text-decoration: none;
        display: inline-block; }
  button:hover, .btn:hover { filter: brightness(1.12); }
  .btn-ghost { background: #fff; color: var(--ink);
               border: 1px solid var(--line); }
  .btn-sm { padding: 4px 10px; font-size: 12.5px; }
  textarea, input[type=text], input[type=number], select {
        width: 100%; padding: 9px 11px; border: 1px solid var(--line);
        border-radius: 7px; font-size: 14px; font-family: inherit; }
  .flash { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46;
           padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 860px){ .grid2 { grid-template-columns: 1fr; } }
  .stat { text-align: center; padding: 6px 18px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12.5px; text-transform: uppercase;
             letter-spacing: .5px; }
  .statrow { display: flex; gap: 8px; justify-content: space-around;
             flex-wrap: wrap; }
  .progress { background: #e2e8f0; border-radius: 999px; height: 10px;
              overflow: hidden; margin-top: 8px; }
  .progress > div { background: var(--accent); height: 100%;
                    transition: width .4s; }
  .diff { font-family: Consolas, monospace; font-size: 13px;
          border: 1px solid var(--line); border-radius: 8px;
          overflow-x: auto; margin-bottom: 14px; }
  .diff .h { background: #f1f5f9; color: var(--muted); padding: 4px 12px;
             font-size: 12px; border-bottom: 1px solid var(--line); }
  .diff .l { padding: 2px 12px; white-space: pre-wrap; word-break: break-word; }
  .diff .add { background: #dcfce7; }
  .diff .del { background: #fee2e2; text-decoration: line-through;
               text-decoration-color: #fca5a5; }
  .shots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 1000px){ .shots { grid-template-columns: 1fr; } }
  .shots figure { margin: 0; }
  .shots figcaption { font-size: 13px; color: var(--muted); margin-bottom: 6px;
                      font-weight: 600; }
  .shots img { width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .urlcell { max-width: 480px; overflow: hidden; }
  .urlcell a { display: inline-block; max-width: 100%; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap;
               vertical-align: bottom; }
  .liveurl { font-size: 12px; color: #0f5bd7 !important; }
  .liveurl:hover { text-decoration: underline; }
  .titlelink { color: var(--ink) !important; font-weight: 600;
               text-decoration: none; }
  .titlelink:hover { color: var(--accent) !important;
                     text-decoration: underline; }
  .titlelink.provisional { color: var(--muted) !important; font-weight: 500; }

  /* --- toolbar / controls --- */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar .grow { flex: 1 1 260px; }
  select.ctl { width: auto; min-width: 140px; background: #fff; cursor: pointer; }
  .iconbtn { background: #fff; border: 1px solid var(--line); color: var(--muted);
             width: 38px; height: 38px; border-radius: 8px; font-size: 16px;
             cursor: pointer; line-height: 1; }
  .iconbtn:hover { color: var(--ink); border-color: var(--muted); }
  .linkbtn { background: none; border: 0; color: #0f5bd7; font-size: 13px;
             cursor: pointer; padding: 0; text-decoration: underline; }
  .quickchips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  details.addbox summary { cursor: pointer; font-weight: 600; font-size: 15px;
                           color: var(--ink); list-style: none; }
  details.addbox summary::-webkit-details-marker { display: none; }
  details.addbox summary::before { content: "＋ "; color: var(--accent); }
  details.addbox[open] summary::before { content: "− "; }
  .exports { font-size: 12.5px; color: var(--muted); }
  .exports a { margin-left: 10px; }
  /* multi-select filter dropdowns */
  .dd { position: relative; }
  .dd > summary { list-style: none; cursor: pointer; padding: 9px 14px;
                  border: 1px solid var(--line); border-radius: 8px;
                  background: #fff; font-size: 14px; user-select: none;
                  white-space: nowrap; }
  .dd > summary::-webkit-details-marker { display: none; }
  .dd > summary::after { content: " ▾"; color: var(--muted); }
  .dd[open] > summary { border-color: var(--muted); }
  .dd .panel { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0;
               min-width: 250px; max-height: 330px; overflow: auto;
               background: #fff; border: 1px solid var(--line);
               border-radius: 10px; padding: 7px;
               box-shadow: 0 12px 32px rgba(15, 23, 42, .14); }
  .dd .panel label { display: flex; gap: 9px; align-items: center;
                     padding: 7px 9px; border-radius: 6px; font-size: 13.5px;
                     cursor: pointer; white-space: nowrap; }
  .dd .panel label:hover { background: var(--bg); }
  .dd .cnt { color: var(--muted); margin-left: auto; font-size: 12px;
             font-variant-numeric: tabular-nums; }
  .fbadge { background: var(--accent); color: #fff; border-radius: 999px;
            padding: 1px 7px; font-size: 11px; margin-left: 5px;
            font-weight: 700; }

  /* --- modern search --- */
  .hero { background: linear-gradient(180deg, #ffffff, #f8fafc);
          border: 1px solid var(--line); border-radius: 14px;
          padding: 22px 24px 18px; margin-bottom: 18px; }
  .hero h1 { font-size: 23px; margin: 0 0 5px; }
  .bigsearch { display: flex; gap: 9px; margin-top: 15px; max-width: 660px; }
  .bigsearch .sugwrap { display: flex; flex: 1 1 auto; }
  .bigsearch .sicon-lead { position: absolute; left: 13px; top: 50%;
                           transform: translateY(-50%); width: 17px; height: 17px;
                           color: var(--muted); pointer-events: none; z-index: 1; }
  .bigsearch input[type=text] { font-size: 15px; padding: 11px 14px 11px 40px;
                                border-radius: 10px; width: 100%; background: #fff;
                                color: var(--ink); border: 1.5px solid var(--line);
                                box-sizing: border-box;
                                transition: border-color .15s, box-shadow .15s; }
  .bigsearch input[type=text]::placeholder { color: #9aa4b2; }
  .bigsearch input[type=text]:focus { outline: none; border-color: var(--accent);
                                box-shadow: 0 0 0 3px rgba(183, 0, 45, .14); }
  .bigsearch button { padding: 10px 22px; border-radius: 10px; font-size: 14.5px;
                      font-weight: 600; }
  .pills { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .pill { padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line);
          background: #fff; color: var(--ink); font-size: 12.5px;
          text-decoration: none; }
  .pill:hover { border-color: var(--muted); }
  .pill-on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .rescard { border: 1px solid var(--line); border-radius: 12px;
             padding: 14px 16px; margin-bottom: 12px; background: var(--card);
             transition: box-shadow .15s, border-color .15s; }
  .rescard:hover { box-shadow: 0 6px 20px rgba(15,23,42,.07);
                   border-color: #cbd5e1; }
  .rescard .meta-chips { display: flex; gap: 6px; flex-wrap: wrap;
                         margin-top: 6px; }
  .mchip { font-size: 11.5px; background: var(--bg); border: 1px solid var(--line);
           border-radius: 6px; padding: 2px 7px; color: var(--muted); }
  .pagelist { margin: 10px 0 0; padding: 0; list-style: none;
              border-top: 1px dashed var(--line); }
  .pagelist li { padding: 7px 0 0; font-size: 13.5px; }
  form.inline { display: inline; }
  .b-live { background: #dcfce7; color: #166534; }
  .b-rejected { background: #fee2e2; color: #991b1b; }
  .b-type { background: #eef2ff; color: #3730a3; font-weight: 600; }
  .btn-reject { background: #fff; color: #b91c1c; border: 1.5px solid #fca5a5; }
  .verdict { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
             margin-top: 14px; padding-top: 12px;
             border-top: 1px solid var(--line); }
  .verdict .muted { flex-basis: 100%; font-size: 12.5px; }
  .shots a { display: block; cursor: zoom-in; }
  .shots2 { grid-template-columns: 1fr 1fr; }
  .regionstrip { display: block; cursor: zoom-in; margin: 10px 0; }
  .regionstrip img { max-width: 100%; border: 1px solid var(--line);
                     border-radius: 8px; display: block; }
  .libgrid { display: grid; grid-template-columns: 300px 1fr; gap: 22px; }
  @media (max-width: 900px){ .libgrid { grid-template-columns: 1fr; } }
  .libshot img { width: 100%; max-height: 560px; object-fit: cover;
                 object-position: top; border: 1px solid var(--line);
                 border-radius: 8px; cursor: zoom-in; }
  .libcat { border: 1px solid var(--line); border-radius: 8px;
            padding: 10px 14px; margin-bottom: 10px; background: #fbfcfe; }
  .libcat summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
  .libcat summary b { color: var(--accent); margin-left: 4px; }
  .liblist { margin: 8px 0 4px; padding-left: 20px; font-size: 13.5px;
             max-height: 340px; overflow-y: auto; }
  .liblist li { margin: 3px 0; word-break: break-word; }
  /* browse-by-category hierarchy */
  .cattree { list-style: none; margin: 8px 0 2px; padding-left: 6px;
             font-size: 13.5px; }
  .cattree ul { list-style: none; margin: 2px 0 2px; padding-left: 18px;
                border-left: 1px solid var(--line); }
  .cattree li { position: relative; padding: 3px 0 3px 14px; }
  .cattree li::before { content: ""; position: absolute; left: 0; top: 13px;
                        width: 9px; height: 1px; background: var(--line); }
  .cattree > li { padding-left: 0; }
  .cattree > li::before { display: none; }
  .libgroup { margin: 12px 0 2px 4px; font-size: 13px; color: var(--accent);
              text-transform: uppercase; letter-spacing: .05em; }
  .hit { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
         margin-bottom: 10px; background: #fbfcfe; }
  .hit-head { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .hit-title { font-weight: 600; color: var(--ink); text-decoration: none;
               font-size: 14.5px; }
  a.hit-title:hover { color: var(--accent); text-decoration: underline; }
  .searchbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .searchbar input[type=text] { flex: 1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .chip { display: inline-block; padding: 4px 13px; border-radius: 999px;
          border: 1px solid var(--line); background: #fff; color: var(--ink);
          font-size: 13px; text-decoration: none; }
  .chip b { color: var(--accent); }
  .chip-on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip-on b { color: #ff9eb0; }
  .bulkbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
             background: #f8fafc; border: 1px solid var(--line);
             border-radius: 8px; padding: 8px 12px; margin: 12px 0; }
  .bulkbar .act:disabled { opacity: .4; cursor: not-allowed; }
  #bulkhint { color: var(--muted); font-weight: 500; }
  .statlink { text-decoration: none; color: inherit; border-radius: 8px;
              transition: background .12s; }
  .statlink:hover { background: #f1f5f9; }
  .quickchips { display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
                margin-top: 12px; }
  /* tone a chip's COUNT so problems (red) and healthy (green) scan at a glance,
     while the chip body stays neutral and calm */
  .chip-bad b  { color: #dc2626; }
  .chip-warn b { color: #d97706; }
  .chip-good b { color: #16a34a; }
  .chip-on.chip-bad b, .chip-on.chip-warn b, .chip-on.chip-good b { color: #fff; }
  .pager { display: flex; gap: 14px; align-items: center;
           justify-content: center; margin-top: 14px; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent);
                         cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="logo">Infineon<span>Watch</span></div>
  <nav>
    <a href="{{ url_for('index') }}">Dashboard</a>
    <a href="{{ url_for('search_items') }}">Search content</a>
    <a href="{{ url_for('hierarchy') }}">Hierarchy</a>
    <a href="{{ url_for('history') }}">Run history</a>
    <a href="{{ url_for('settings_view') }}">Settings</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
